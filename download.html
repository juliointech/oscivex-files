<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloading Ablaze FX</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root { --bg: #110f0e; --text: #efe7df; --muted: #a89c91; --accent: #f37a3c; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 26px; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 18px; }
  a { color: var(--accent); }
  .btn { display: inline-block; background: var(--accent); color: #1d0a02; font-weight: 700; text-decoration: none; padding: 12px 20px; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Starting your download…</h1>
  <p id="msg">Ablaze FX for Windows. If nothing happens in a few seconds, use the button below.</p>
  <a class="btn" id="link" href="./">Download Ablaze FX</a>
</main>
<script>
  // Always hands out the newest installer: reads the same latest.json the app's one-click updates use.
  // Add #check to the address to see the link without starting the download.
  (function () {
    var ALLOWED = "https://raw.githubusercontent.com/juliointech/oscivex-files/main/";
    var link = document.getElementById("link");
    fetch("latest.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (doc) {
        var p = doc && doc.payload;
        if (!p || p.kind !== "update" || typeof p.url !== "string" || p.url.indexOf(ALLOWED) !== 0) throw new Error("bad manifest");
        // Hand out the zip beside the installer (browsers warn far less about a zip); the bare .exe if there's no zip.
        var zip = p.url.replace(/\.exe$/i, ".zip");
        return fetch(zip, { method: "HEAD", cache: "no-store" })
          .then(function (r) { return r.ok ? zip : p.url; }, function () { return p.url; })
          .then(function (url) {
            link.href = url;
            link.textContent = "Download Ablaze FX " + p.version;
            if (url === zip) document.getElementById("msg").textContent =
              "When it has downloaded, open the zip and double-click AblazeFX-Setup inside it. If nothing happens in a few seconds, use the button below.";
            if (location.hash !== "#check") location.replace(url);
          });
      })
      .catch(function () {
        document.getElementById("title").textContent = "Get Ablaze FX";
        document.getElementById("msg").textContent = "Couldn't find the newest version just now. The download page below always has it.";
        link.href = "./";
        link.textContent = "Open the download page";
      });
  })();
</script>
</body>
</html>
