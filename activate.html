<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Activate Oscivex</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: #0B1220; color: #E8EEF8; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { max-width: 440px; width: 100%; background: #111A2E; border: 1px solid #22304d; border-radius: 16px; padding: 24px; }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p { margin: 8px 0; color: #b6c2d6; }
  .btn { display: inline-block; margin-top: 10px; padding: 10px 16px; border-radius: 10px; border: 0; cursor: pointer;
    background: #22D3EE; color: #06202a; font: 600 14px system-ui, sans-serif; text-decoration: none; }
  .btn.ghost { background: transparent; color: #22D3EE; border: 1px solid #22D3EE55; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: #8fa1bd; }
  code { display: block; margin-top: 8px; padding: 10px; border-radius: 8px; background: #0B1220; color: #E8EEF8;
    font-size: 12px; word-break: break-all; }
  .bad { color: #f87171; }
</style>
</head>
<body>
<main class="card">
  <h1>Activate Oscivex</h1>
  <p id="msg">Opening Oscivex on this PC…</p>
  <p class="small">If your browser asks, choose <b>Open Oscivex</b>.</p>
  <a class="btn" id="open" href="#">Open Oscivex</a>
  <details>
    <summary>Nothing happened?</summary>
    <p>Make sure Oscivex is installed on this PC (version 2.23 or newer). Or copy the key and paste it in Oscivex: Copy Trading, Unlock.</p>
    <code id="key"></code>
    <button class="btn ghost" id="copy" type="button">Copy key</button>
  </details>
</main>
<script>
  // The key comes after "#", so it never leaves this browser: GitHub only serves this page.
  var key = decodeURIComponent((location.hash || '').slice(1));
  var ok = /^[A-Za-z0-9._=-]{20,4000}$/.test(key);
  var link = 'oscivex://activate?key=' + encodeURIComponent(key);
  if (!ok) {
    document.getElementById('msg').innerHTML = '<span class="bad">This link is incomplete.</span> Open the Activate button from the Telegram message again.';
    document.getElementById('open').style.display = 'none';
  } else {
    document.getElementById('key').textContent = key;
    document.getElementById('open').href = link;
    setTimeout(function () { location.href = link; }, 300);
  }
  document.getElementById('copy').onclick = function () {
    try { navigator.clipboard.writeText(key); this.textContent = 'Copied'; } catch (e) { /* select it by hand */ }
  };
</script>
</body>
</html>
